# AIEM Connect — full stack on PostgreSQL.
#
# One-command setup (generates .env with secrets, builds, starts, runs migrations + seed):
#   ./start.sh          (or: make up)
#
# Manual:  cp .env.docker.example .env  (set the REQUIRED secrets)  &&  docker compose up -d --build
#
#   web  -> http://localhost:3000        api -> http://localhost:5000 (health: /health)
#   With the reverse proxy (single origin on :80):  docker compose --profile proxy up -d --build
#
# Data lives in the named volumes below; `docker compose down` keeps it, `down -v` deletes it.

# Container logs are kept on the host disk. Unbounded, a busy API fills it in weeks and takes the whole server down with it:
# keep at most 3 files of 10 MB per service (the access log is one line per request, see docs/PRODUCTION_CHECKLIST.md).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

name: aiem-connection

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiem_connect}
      POSTGRES_USER: ${POSTGRES_USER:-aiem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bound to localhost only: reachable from your machine (psql, Prisma Studio), not the network
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  # Notification events (in-app notifications, the e-mail to the college administrator when a registration is waiting, the
  # e-mails to applicants). One broker that is also its own controller (KRaft, no ZooKeeper). It is only reachable inside the
  # compose network. Failed events end up in the "<prefix>.notifications.dlq" topic (docs/KAFKA.md). Without this service
  # (KAFKA_BROKERS unset) the API still works: it delivers the same events in-process.
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # one node: every internal topic can only have one replica
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # the API creates its two topics itself, with the partition count it wants
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiem}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aiem_connect}?schema=public
      REDIS_URL: redis://redis:6379
      # Notification events travel through Kafka (docs/KAFKA.md)
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-aiem}
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-3}
      # Extra address(es) for "a registration is waiting" (for example the alumni office); the administrator accounts are always told
      APPROVAL_NOTIFY_EMAIL: ${APPROVAL_NOTIFY_EMAIL:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ random characters) in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET (32+ random characters) in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # Reverse proxies in front of the API (rate limits key on the client IP): 1 = nginx/one load balancer,
      # 2 = e.g. Cloudflare + nginx, 0 = API reachable directly (see docs/DOCKER.md)
      TRUST_PROXY: ${TRUST_PROXY:-1}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost}
      # The API refuses to start on an unsafe production configuration (src/config/productionChecks.ts). The two settings
      # below are only for trying the stack on ONE machine without a domain or mail server; see docs/PRODUCTION_CHECKLIST.md.
      ALLOW_INSECURE_PRODUCTION_CONFIG: ${ALLOW_INSECURE_PRODUCTION_CONFIG:-false}
      # Empty = the production default (on): no session before the e-mail address is verified
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-}
      # First boot: creates the super admin from SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD (idempotent)
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@aiemgoa.ac.in}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-false}
      GEOCODER_URL: ${GEOCODER_URL:-https://nominatim.openstreetmap.org}
      GEOCODER_EMAIL: ${GEOCODER_EMAIL:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@aiemgoa.ac.in}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
    volumes:
      - uploads_data:/app/server/uploads
    # Loopback by default: the API is meant to sit behind the proxy profile (or your own TLS proxy). Publishing it
    # on every interface lets clients spoof X-Forwarded-For and dodge per-IP rate limits. To expose it
    # directly set API_BIND=0.0.0.0 together with TRUST_PROXY=0.
    ports:
      - "${API_BIND:-127.0.0.1}:${API_HOST_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [backend, frontend]

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        # Baked into the browser bundle at build time: the URL *browsers* use to reach the API
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
        NEXT_PUBLIC_MAP_TILE_URL: ${NEXT_PUBLIC_MAP_TILE_URL:-}
        NEXT_PUBLIC_MAP_TILE_ATTRIBUTION: ${NEXT_PUBLIC_MAP_TILE_ATTRIBUTION:-}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Server-side fetches (e.g. event SEO metadata) reach the API over the compose network
      API_INTERNAL_URL: http://api:5000/api
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [frontend]

  # Optional single-origin reverse proxy: / -> web, /api /socket.io /uploads /health -> api.
  # Build the web image with NEXT_PUBLIC_API_URL=http(s)://<your-host>/api when using it.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    profiles: [proxy]
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${PROXY_HOST_PORT:-80}:80"
    networks: [frontend]

networks:
  backend:
  frontend:

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  uploads_data:

# Single-origin reverse proxy for docker-compose (`docker compose --profile proxy up`).
#   /                      -> web (Next.js)
#   /api, /uploads, /health -> api (Express)
#   /socket.io             -> api (WebSocket upgrade for chat / notifications)
# TLS: terminate HTTPS in front of this (host nginx/Caddy/Cloudflare) or add a 443 server block.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  keepalive_timeout 65;

  # Matches the API's 10 MB JSON/upload limit
  client_max_body_size 10m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream api { server api:5000; }
  upstream web { server web:3000; }

  server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ { proxy_pass http://api; }
    location /uploads/ { proxy_pass http://api; }
    location = /health { proxy_pass http://api; }

    location /socket.io/ {
      proxy_pass http://api;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}

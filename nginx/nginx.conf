# Single-origin reverse proxy for docker-compose (`docker compose --profile proxy up`).
#   /                      -> web (Next.js)
#   /api, /uploads, /health -> api (Express)
#   /socket.io             -> api (WebSocket upgrade for chat / notifications)
# TLS: terminate HTTPS in front of this (host nginx/Caddy/Cloudflare) or add a 443 server block.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  keepalive_timeout 65;

  # Image uploads are up to 10 MB (the API caps JSON bodies at 1 MB and checks every upload itself)
  client_max_body_size 10m;

  # Slow-client protection (slowloris): a request must arrive promptly
  client_header_timeout 10s;
  client_body_timeout 30s;
  send_timeout 30s;

  # Per-address request rate on the sign-in / sign-up / password endpoints, in front of the API's own limits.
  # This is where a guessing run from ONE address is stopped cheaply; there is deliberately no per-account lockout
  # (that would let anybody lock any alumnus out). Behind Cloudflare or another CDN, restore the real client address
  # first (real_ip_header / set_real_ip_from), otherwise every visitor shares one bucket.
  limit_req_zone $binary_remote_addr zone=auth_endpoints:10m rate=5r/s;
  limit_req_status 429;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream api { server api:5000; }
  upstream web { server web:3000; }

  server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Post/reel videos may be up to 100 MB (the API enforces the limit and checks the format)
    location = /api/posts/video {
      client_max_body_size 110m;
      proxy_request_buffering off;
      proxy_read_timeout 300s;
      proxy_pass http://api;
    }

    # nginx merges repeated slashes, so /api//auth/login lands here too
    location /api/auth/ {
      limit_req zone=auth_endpoints burst=20 nodelay;
      proxy_pass http://api;
    }

    location /api/ { proxy_pass http://api; }
    location /uploads/ { proxy_pass http://api; }
    location = /health { proxy_pass http://api; }

    location /socket.io/ {
      proxy_pass http://api;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
    }

    # No dotfiles (.env, .git, ...) from anywhere
    location ~ /\.(?!well-known) { deny all; return 404; }

    location / {
      proxy_pass http://web;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}

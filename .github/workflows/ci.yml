name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'

jobs:
  # =====================
  # Backend: typecheck, lint, unit + integration tests, build
  # =====================
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: alumni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./server
        run: npx prisma generate

      - name: Typecheck (src + tests)
        working-directory: ./server
        run: npm run typecheck

      - name: Lint
        working-directory: ./server
        run: npm run lint

      - name: Unit & route-level RBAC tests (with coverage)
        working-directory: ./server
        run: npm run test:coverage

      - name: Integration tests (real PostgreSQL)
        working-directory: ./server
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:testpassword@127.0.0.1:5432/alumni_test

      - name: Build
        working-directory: ./server
        run: npm run build

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage
          retention-days: 7

  # =====================
  # Frontend: typecheck, unit tests, build
  # =====================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Typecheck
        working-directory: ./client
        run: npm run typecheck

      - name: Unit tests
        working-directory: ./client
        run: npm test

      - name: Build
        working-directory: ./client
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api

  # =====================
  # Docker Build (images only; deployment runs them)
  # =====================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose.yml
        run: POSTGRES_PASSWORD=x JWT_SECRET=x JWT_REFRESH_SECRET=x docker compose config --quiet

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/alumni-connect-api:latest
            ${{ secrets.DOCKER_USERNAME }}/alumni-connect-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: client/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/alumni-connect-web:latest
            ${{ secrets.DOCKER_USERNAME }}/alumni-connect-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Weekly dependency updates as pull requests (never merged automatically: CI and the Docker verification must be green first).
# Security advisories arrive as their own pull requests regardless of this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: '04:00', timezone: Asia/Kolkata }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Majors are done on purpose (Next 16, zod 4, ...), with their own branch and review
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message: { prefix: 'chore(deps)' }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: '04:00', timezone: Asia/Kolkata }
    open-pull-requests-limit: 3
    commit-message: { prefix: 'chore(ci)' }

  - package-ecosystem: docker
    directories: [/server, /client]
    schedule: { interval: weekly, day: monday, time: '04:00', timezone: Asia/Kolkata }
    open-pull-requests-limit: 3
    commit-message: { prefix: 'chore(docker)' }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday, time: '04:00', timezone: Asia/Kolkata }
    open-pull-requests-limit: 3
    commit-message: { prefix: 'chore(docker)' }
